
name: Kubernetes CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: k8s-runner

    env:
      BUILDKIT_HOST: unix:///run/buildkit/buildkitd.sock
      IMAGE_NAME: ghcr.io/doit1607/kubernetes-cicd

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install BuildKit client
      - name: Install buildctl
        shell: bash
        run: |
          set -euo pipefail

          BUILDKIT_VERSION="v0.20.2"

          curl -fsSL \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
            -o /tmp/buildkit.tar.gz

          mkdir -p /tmp/buildkit
          tar -xzf /tmp/buildkit.tar.gz -C /tmp/buildkit

          mkdir -p "$HOME/.local/bin"
          install /tmp/buildkit/bin/buildctl "$HOME/.local/bin/buildctl"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 3. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build and push image using Rootless BuildKit
      - name: Build and Push Image
        shell: bash
        run: |
          set -euo pipefail

          buildctl \
            --addr "$BUILDKIT_HOST" \
            build \
            --progress=plain \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --opt filename=Dockerfile \
            --output "type=image,name=${IMAGE_NAME}:latest,name=${IMAGE_NAME}:${GITHUB_SHA},push=true"

      # 5. Install kubectl
      - name: Install kubectl
        shell: bash
        run: |
          set -euo pipefail

          KUBECTL_VERSION="v1.32.13"

          curl -fsSLo kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"

          chmod +x kubectl
          mkdir -p "$HOME/.local/bin"
          install kubectl "$HOME/.local/bin/kubectl"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 6. Configure in-cluster Kubernetes authentication
      - name: Configure Kubernetes access
        shell: bash
        run: |
          set -euo pipefail

          SA_DIR="/var/run/secrets/kubernetes.io/serviceaccount"

          test -r "$SA_DIR/token"
          test -r "$SA_DIR/ca.crt"

          mkdir -p "$HOME/.kube"

          cat > "$HOME/.kube/config" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: in-cluster
              cluster:
                server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
                certificate-authority: ${SA_DIR}/ca.crt
          users:
            - name: github-deployer
              user:
                tokenFile: ${SA_DIR}/token
          contexts:
            - name: in-cluster
              context:
                cluster: in-cluster
                user: github-deployer
          current-context: in-cluster
          EOF

          kubectl auth can-i get deployments -n default
          kubectl auth can-i patch deployments -n default
          kubectl auth can-i create services -n default
          kubectl auth can-i create ingresses.networking.k8s.io -n default

      # 7. Deploy website to Kubernetes
      - name: Deploy to Kubernetes
        shell: bash
        run: |
          set -euo pipefail

          # Apply Deployment with this commit's image tag
          sed "s/IMAGE_TAG/${GITHUB_SHA}/g" \
            k8s/deployment.yaml | kubectl apply -f -

          # Apply Service and Ingress
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

          # Wait for rollout
          kubectl rollout status deployment/web-demo \
            -n default \
            --timeout=180s

          echo "Deployment completed successfully!"
          kubectl get deployment,service,ingress -n default
