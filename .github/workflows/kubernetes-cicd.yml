name: Kubernetes CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: k8s-runner

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install BuildKit client
        shell: bash
        run: |
          BUILDKIT_VERSION="v0.20.2"

          mkdir -p "$RUNNER_TEMP/buildkit"

          curl -fsSL \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/buildkit.tar.gz"

          tar -xzf "$RUNNER_TEMP/buildkit.tar.gz" \
            -C "$RUNNER_TEMP/buildkit" \
            bin/buildctl

          echo "$RUNNER_TEMP/buildkit/bin" >> "$GITHUB_PATH"

      - name: Check BuildKit connection
        shell: bash
        run: |
          echo "BuildKit host: $BUILDKIT_HOST"
          buildctl --addr "$BUILDKIT_HOST" debug workers

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        shell: bash
        run: |
          buildctl \
            --addr "$BUILDKIT_HOST" \
            build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --opt filename=Dockerfile \
            --output "type=image,name=ghcr.io/doit1607/kubernetes-cicd:latest,ghcr.io/doit1607/kubernetes-cicd:${GITHUB_SHA},push=true"
